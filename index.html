<!DOCTYPE html>
<html>
<head>
	<title>Line in Space - 3D WebGL Implementation</title>

	<meta charset="utf-8">

	<meta property="og:title" content="Line in Space - 3D WebGL Implementation">

	<meta property="og:url" content="http://flashbag.github.io/line-in-space/">
	<meta property="og:image" content="http://flashbag.github.io/line-in-space/assets/image.png">
	<meta property="og:site_name" content="Line in Space - 3D WebGL Implementation">
	<meta property="og:description" content="Best way to learn basics of lines in space!">

	<link rel="stylesheet" href="assets/css/style.css">

	<script type="importmap">
	{
		"imports": {
			"three": "./assets/three/three.module.js",
			"three/addons/": "./assets/three/addons/"
		}
	}
	</script>
	<script type="module" src="assets/js/main.js"></script>

	<script>
	  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
	  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
	  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
	  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

	  ga('create', 'UA-54871581-1', 'auto');
	  ga('send', 'pageview');

	</script>

</head>
<body>

	<div id="controls">
		<h1>Line in Space</h1>
		<h3><a target="_blank" href="http://goo.gl/RiRTl5">View on Github</a></h3>
		<div class="controls-inner">
			<div>
				<span class="label dot" data-class="dot-controls-a">A</span>
			</div>
			<div>
				<span class="label visibility" data-class="visibility-controls">&#9881;</span>
			</div>
			<div>
				<span class="label dot" data-class="dot-controls-b">B</span>
			</div>

			<div class="clear"></div>

			<div class="controls dot-controls-a">
				<div class="slider-row"><span class="name">X</span><input type="range" id="Ax" class="axis-x" min="0" max="100" step="1"><span class="value" id="Ax-value"></span></div>
				<div class="slider-row"><span class="name">Y</span><input type="range" id="Ay" class="axis-y" min="0" max="100" step="1"><span class="value" id="Ay-value"></span></div>
				<div class="slider-row"><span class="name">Z</span><input type="range" id="Az" class="axis-z" min="0" max="100" step="1"><span class="value" id="Az-value"></span></div>
			</div>
			<div class="controls dot-controls-b">
				<div class="slider-row"><span class="name">X</span><input type="range" id="Bx" class="axis-x" min="0" max="100" step="1"><span class="value" id="Bx-value"></span></div>
				<div class="slider-row"><span class="name">Y</span><input type="range" id="By" class="axis-y" min="0" max="100" step="1"><span class="value" id="By-value"></span></div>
				<div class="slider-row"><span class="name">Z</span><input type="range" id="Bz" class="axis-z" min="0" max="100" step="1"><span class="value" id="Bz-value"></span></div>
			</div>
			<div class="controls visibility-controls">
				<ul id="visibility">
					<li data-object="mainAxes">
						<label><input type="checkbox" checked> Main axes</label>
					</li>
					<li data-object="helperAxes">
						<label><input type="checkbox" checked> Helper axes</label>
					</li>
					<li data-object="A,B,Atext,Btext,AB">
						<label><input type="checkbox" checked> Dots &amp; Line</label>
					</li>
					<li data-object="F,H,P,Ftext,Htext,Ptext,AF,AH,AP,HhP,HhF,FfP,FfH,PfP,PpF,PpH,HpH,HfH,PfP,PhP,FpF,FhF,pF,hF,pH,fH,hP,fP,pFtext,hFtext,pHtext,fHtext,hPtext,fPtext">
						<label><input type="checkbox" checked> Line Traces</label>
					</li>
					<li data-object="AAf,AAp,AAh,BBf,BBp,BBh,AfAy,AfAz,ApAy,ApAx,AhAx,AhAz,BfBy,BfBz,BpBy,BpBx,BhBx,BhBz,AfBf,ApBp,AhBh,Ax,Ay,Az,Bx,By,Bz,Af,Ap,Ah,Bf,Bp,Bh">
						<label><input type="checkbox" checked> Dots Projections</label>
					</li>
				</ul>

			</div>
		</div>

	</div>

</body>
</html>
